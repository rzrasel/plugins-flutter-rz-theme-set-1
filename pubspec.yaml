name: rz_theme_set_1
description: "A simple Flutter plugin for managing and applying reusable app themes with centralized configuration"
version: 1.0.0
repository: https://github.com/rzrasel/plugins-flutter-rz-theme-set-1
homepage: https://github.com/rzrasel/plugins-flutter-rz-theme-set-1

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  #
  #url_launcher: ^6.3.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.rzrasel.themeset.rz_theme_set_1
        pluginClass: RzThemeSet_1Plugin
      ios:
        pluginClass: RzThemeSet_1Plugin
      linux:
        pluginClass: RzThemeSet_1Plugin
      macos:
        pluginClass: RzThemeSet_1Plugin
      windows:
        pluginClass: RzThemeSet_1PluginCApi
      web:
        pluginClass: RzThemeSet_1Web
        fileName: rz_theme_set_1_web.dart

